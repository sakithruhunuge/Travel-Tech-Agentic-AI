[pytest]
testpaths = backend/tests
pythonpath = . backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Fast isolated unit tests without external network or database calls
    integration: Integration tests between multiple modules or components
    e2e: End-to-end full pipeline tests
    slow: Computationally intensive or external LLM tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
